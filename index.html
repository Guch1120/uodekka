<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UO:De Car</title>
  <meta name="theme-color" content="#142c42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="UO:De Car">
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/images/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/frontend/images/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/frontend/images/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- style.css を機能単位に分割（順序はカスケード優先度を保つため元のファイルの並び順と厳密に一致） -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/touch-controls.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/feedback-form.css">
  <link rel="stylesheet" href="css/orientation-prompt.css">
  <link rel="stylesheet" href="css/title-screen.css">
  <link rel="stylesheet" href="css/hud-banners.css">
  <link rel="stylesheet" href="css/course-editor.css">
  <link rel="stylesheet" href="css/update-history.css">
  <link rel="stylesheet" href="css/perks.css">
  <link rel="stylesheet" href="css/responsive-scrollfree.css">
  <link rel="stylesheet" href="css/lobby.css">

  <!-- Three.js CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <!-- Cloudflare WorkerのWebSocketゲームサーバー。 -->
  <script>window.MULTIPLAYER_SERVER_URL = window.MULTIPLAYER_SERVER_URL || 'wss://uodekka-multiplayer.kurehiro1009.workers.dev/ws';</script>
</head>
<body>
  <!-- 画像と余白を含め、画面全体をタッチしてロビーへ進む -->
  <button id="title-screen" class="title-screen" type="button" aria-label="画面をタッチしてゲームをはじめる">
    <img src="frontend/images/title-screen.png" alt="UO:De Car" width="3360" height="1560" fetchpriority="high" draggable="false">
    <span id="title-screen-status" class="title-screen-status" role="status"></span>
  </button>

  <div id="app" inert aria-hidden="true"></div>
  <section id="startup-error" hidden role="alert" style="position:fixed;z-index:100000;bottom:24px;left:5%;width:90%;box-sizing:border-box;padding:20px;background:#142c42;color:white;border-radius:12px">
    <p id="startup-error-message"></p>
    <button id="startup-reload" type="button">再読み込み</button>
    <button id="startup-copy" type="button">診断をコピー</button>
    <pre id="startup-diagnostic" hidden style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:25vh;overflow:auto"></pre>
  </section>

  <!-- ゲームエントリースクリプト -->
  <script type="module">
    const titleScreen = document.getElementById('title-screen');
    const status = document.getElementById('title-screen-status');
    const app = document.getElementById('app');
    // 選択画面を挟まず、起動時から横画面を基本にする。
    let _forceLandscapeRequested = true;

    function detectDeviceInfo() {
      // モバイルブラウザのアドレスバー表示中は window.innerHeight と
      // 実際に描画できる高さが異なるため、visualViewport を優先する。
      const viewport = window.visualViewport;
      const innerW = window.innerWidth;
      const innerH = window.innerHeight;
      // 復帰テストや一部のWebViewでは innerWidth/innerHeight だけが先に
      // 更新されることがあるため、向きが食い違う visualViewport は使わない。
      const visualMatchesOrientation = viewport && ((viewport.width >= viewport.height) === (innerW >= innerH));
      const w = Math.round(visualMatchesOrientation ? viewport.width : innerW);
      const h = Math.round(visualMatchesOrientation ? viewport.height : innerH);
      const dpr = window.devicePixelRatio || 1;
      const screenW = window.screen ? window.screen.width : w;
      const screenH = window.screen ? window.screen.height : h;

      if (document.body) {
        // 復帰直後の一時的な画面寸法で、ユーザーが選んだ横画面モードを失わない。
        document.body.classList.toggle('force-landscape', _forceLandscapeRequested && h > w);
      }

      const isForcedLandscapeInPortrait = document.body && document.body.classList.contains('force-landscape') && (h > w);
      const effW = isForcedLandscapeInPortrait ? h : w;
      const effH = isForcedLandscapeInPortrait ? w : h;

      const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
      const divisor = gcd(Math.round(effW), Math.round(effH)) || 1;
      const aspect = `${Math.round(effW / divisor)}:${Math.round(effH / divisor)}`;
      const ratio = (effW / Math.max(1, effH)).toFixed(2);
      const info = {
        viewportWidth: w,
        viewportHeight: h,
        effectiveWidth: effW,
        effectiveHeight: effH,
        screenWidth: screenW,
        screenHeight: screenH,
        dpr,
        aspectRatio: aspect,
        ratioVal: Number(ratio),
        isLandscape: isForcedLandscapeInPortrait || (w >= h),
        isCompact: effH <= 500
      };
      window.deviceInfo = info;
      document.documentElement.dataset.aspectRatio = aspect;
      document.documentElement.dataset.isCompact = String(info.isCompact);
      document.documentElement.dataset.isLandscape = String(info.isLandscape);
      document.documentElement.style.setProperty('--app-width', `${effW}px`);
      document.documentElement.style.setProperty('--app-height', `${effH}px`);
      if (document.body) {
        document.body.dataset.aspectRatio = aspect;
        document.body.dataset.isCompact = String(info.isCompact);
        document.body.dataset.isLandscape = String(info.isLandscape);
      }
      return info;
    }

    window.requestForcedLandscapeLayout = () => {
      _forceLandscapeRequested = true;
      detectDeviceInfo();
    };

    let _resumeLayoutTimers = [];
    function syncAppLayout(tryOrientationLock = false) {
      if (tryOrientationLock && window._gameSessionStarted && screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
      detectDeviceInfo();
      if (window.gameInstance) {
        if (window.gameInstance.renderer) window.gameInstance.renderer.onResize();
        if (window.gameInstance.inputManager) window.gameInstance.inputManager.applyLayoutToElements();
      }
      window.dispatchEvent(new Event('resize'));
    }

    function handleAppResume() {
      syncAppLayout(true);
      _resumeLayoutTimers.forEach(clearTimeout);
      _resumeLayoutTimers = [120, 500, 1200].map(delay => setTimeout(syncAppLayout, delay));
    }

    window.recoverAppPresentation = () => {
      window.requestForcedLandscapeLayout();
      const root = document.documentElement;
      const requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
      if (requestFullscreen) requestFullscreen.call(root).catch(() => {});
      if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(() => {});
      handleAppResume();
    };

    detectDeviceInfo();
    window.addEventListener('resize', detectDeviceInfo);
    window.addEventListener('orientationchange', handleAppResume);
    window.addEventListener('pageshow', handleAppResume);
    window.addEventListener('focus', handleAppResume);
    window.addEventListener('uodekka-app-resume', handleAppResume);
    if (screen.orientation && typeof screen.orientation.addEventListener === 'function') {
      screen.orientation.addEventListener('change', handleAppResume);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        handleAppResume();
      }
    });
    if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', handleAppResume);
    }

    async function enableForcedLandscape() {
      window.requestForcedLandscapeLayout();
      const root = document.documentElement;
      const requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
      if (requestFullscreen && navigator.maxTouchPoints > 0 && !document.fullscreenElement) {
        try { await requestFullscreen.call(root); } catch { /* 非対応時は横画面レイアウトを維持する。 */ }
      }
      if (typeof screen.orientation?.lock === 'function') {
        try { await screen.orientation.lock('landscape'); } catch { /* OSの向きはブラウザの許可範囲に従う。 */ }
      }
      syncAppLayout();
    }

    titleScreen.addEventListener('click', async (event) => {
      event.stopPropagation();
      if (titleScreen.disabled) return;

      // 全画面とOSの向き固定は、開始タップの権限が有効な間に要求する。
      void enableForcedLandscape();
      window._gameSessionStarted = true;
      titleScreen.disabled = true;
      status.textContent = '読み込み中…';

      let startupStage = 'module';
      try {
        // タッチ完了後に初期化し、開始操作がゲーム入力に混ざるのを防ぐ。
        const { Game } = await import('./backend/game.js?v=20260922-feedback-2');
        startupStage = 'initialization';
        window.gameInstance = new Game();
        app.inert = false;
        app.removeAttribute('aria-hidden');
        titleScreen.remove();
      } catch (error) {
        console.error('ゲームの起動に失敗しました:', error);
        const fetchFailure = startupStage === 'module' && /fetch|load.*module|importing.*module|network/i.test(error.message || '');
        const message = fetchFailure
          ? 'ゲームファイルを取得できませんでした。再読み込みしてください。'
          : 'ゲームの起動処理でエラーが発生しました。診断をコピーして管理者へお知らせください。';
        status.textContent = message;
        document.getElementById('startup-error-message').textContent = message;
        document.getElementById('startup-error').hidden = false;
        // URLのクエリや保存済みプレイヤー情報は診断に含めない。
        const diagnostic = JSON.stringify({ stage: startupStage, name: error.name || 'Error', message: String(error.message || error).replace(/https?:\/\/[^\s)]+/g, '[URL]') }, null, 2);
        document.getElementById('startup-reload').onclick = () => location.reload();
        document.getElementById('startup-copy').onclick = async () => {
          const output = document.getElementById('startup-diagnostic');
          output.hidden = false;
          try { await navigator.clipboard.writeText(diagnostic); output.textContent = '診断をコピーしました。'; }
          catch { output.textContent = diagnostic; }
        };
      }
    });
  </script>
</body>
</html>
